name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r app/backend/requirements.txt
      - run: python -m unittest discover -s app/backend/tests -p 'test_*.py'
      - run: python -m compileall -q app/backend
      - run: bash -n scripts/run_cleanvideo_job.sh scripts/run_voice_only_job.sh scripts/run_02_latentsync_overlap.sh scripts/run_voice_training.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
